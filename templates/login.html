
{% extends "base.html" %}
{% block content %}
<div class="card login-card">
  <h1>Sign in</h1>
  <p class="muted">Zero-trust: every request is verified. No implicit trust.</p>
  <form method="post">
    <label>Username</label>
    <input type="text" name="username" autofocus>
    <label>Password</label>
    <input type="password" name="password">
    <button type="submit">Verify &amp; Sign in</button>
  </form>
  <div class="hint">
    <strong>Demo accounts</strong>
    <table>
      <tr><th>User</th><th>Password</th><th>Role</th></tr>
      <tr><td>alice</td><td>alice123</td><td>admin</td></tr>
      <tr><td>bob</td><td>bob123</td><td>employee</td></tr>
      <tr><td>carol</td><td>carol123</td><td>contractor</td></tr>
      <tr><td>dave</td><td>dave123</td><td>guest</td></tr>
    </table>
  </div>
</div>
{% endblock %}
